name: browser security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
      CADDY_SHA512: 8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install matched Chromium and local certificate tooling
        run: |
          pnpm --filter @daifuku/web exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libnss3-tools openssl
      - name: Verify and extract the pinned official Caddy archive
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/caddy.tar.gz" \
            https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz
          printf '%s  %s\n' "$CADDY_SHA512" "$RUNNER_TEMP/caddy.tar.gz" | sha512sum --check --strict
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
          chmod 755 "$RUNNER_TEMP/caddy"
          "$RUNNER_TEMP/caddy" version
      - name: Build the production Web with the same-origin API base
        env:
          VITE_API_URL: /api
        run: pnpm --filter @daifuku/web build
      - name: Exercise compiled Web through both generated Caddy profiles
        env:
          CADDY_BIN: ${{ runner.temp }}/caddy
        run: pnpm test:browser-security
      - name: Retain synthetic browser security results only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-security-results
          path: apps/web/test-results/browser-security
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7
