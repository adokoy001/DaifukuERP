# Synthetic fixtures only. See .github/ci/README.md for the trust model and pinned upstream releases.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.2'
  TZ: Asia/Tokyo
  DAIFUKU_PACKS: all

jobs:
  gate:
    name: gate and Web build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL_OWNER: postgres://daifuku_owner:owner@127.0.0.1:5432/daifuku_ci_test
      DATABASE_URL: postgres://daifuku_app:app@127.0.0.1:5432/daifuku_ci_test
      TEST_DATABASE_URL_OWNER: postgres://daifuku_owner:owner@127.0.0.1:5432/daifuku_ci_test
      TEST_DATABASE_URL: postgres://daifuku_app:app@127.0.0.1:5432/daifuku_ci_test
      JWT_SECRET: synthetic-ci-only-not-for-deployment-3927
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; version from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test roles and databases in this job's new service
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -d postgres -f .github/ci/databases.sql
      - run: pnpm gate
      - run: pnpm --filter @daifuku/web typecheck
      - run: pnpm --filter @daifuku/web build

  e2e:
    name: browser workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL_OWNER: postgres://daifuku_owner:owner@127.0.0.1:5432/daifuku_ci_e2e
      DATABASE_URL: postgres://daifuku_app:app@127.0.0.1:5432/daifuku_ci_e2e
      JWT_SECRET: synthetic-ci-only-not-for-deployment-3927
      HOST: 127.0.0.1
      PORT: '3000'
      VITE_API_URL: http://localhost:3000
      E2E_API_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      E2E_PREPARE: '1'
      E2E_SCREENSHOTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the lockfile's matching Chromium
        run: pnpm --filter @daifuku/web exec playwright install --with-deps chromium
      - name: Create fixture roles and databases in this job's new service
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -d postgres -f .github/ci/databases.sql
      - name: Choose one Tokyo business date for preparation and every test
        run: echo "E2E_INVOICE_DATE=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"
      - name: Prepare empty database and unapplied industry companies
        run: pnpm --filter @daifuku/api exec tsx src/db/e2e-fixture.ts
      - name: Start isolated API and Web
        run: bash .github/ci/start-e2e.sh
      - name: Run industry UI prerequisites, then the remaining browser tests
        run: pnpm --filter @daifuku/web exec playwright test --reporter=list,html
      - name: Upload synthetic browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            ci-logs/*.log
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false

  identity:
    name: identity browser workflows (synthetic OIDC and TLS SMTP)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL_OWNER: postgres://daifuku_owner:owner@127.0.0.1:5432/daifuku_ci_enterprise_e2e
      TEST_DATABASE_URL: postgres://daifuku_app:app@127.0.0.1:5432/daifuku_ci_enterprise_e2e
      E2E_IDENTITY_PREPARE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the lockfile's matching Chromium
        run: pnpm --filter @daifuku/web exec playwright install --with-deps chromium
      - name: Create fixture roles and databases in this job's new service
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -d postgres -f .github/ci/databases.sql
      - name: Start and stop synthetic API, browser, OIDC and TLS SMTP with an empty database
        run: pnpm test:identity:e2e
      - name: Upload synthetic browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-browser-diagnostics
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false

  setup:
    name: safe setup acceptance (isolated cluster)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use Ubuntu 24.04's PostgreSQL 16 tools
        run: |
          test -x /usr/lib/postgresql/16/bin/initdb
          /usr/lib/postgresql/16/bin/pg_dump --version
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          echo "SETUP_FIXTURE_DIR=$RUNNER_TEMP/daifuku-setup-ci" >> "$GITHUB_ENV"
          echo "SETUP_TEST_ENV_FILE=$RUNNER_TEMP/daifuku-setup-ci/test.env" >> "$GITHUB_ENV"
      - name: Create a new private fixture cluster with random credentials
        run: node scripts/setup-test-cluster.mjs --directory "$SETUP_FIXTURE_DIR" --bin /usr/lib/postgresql/16/bin --port 55443
      - name: Install, rerun, restore, upgrade, fail and resume
        run: pnpm test:setup
      # The cluster includes generated credentials, protected env files and database backups. Never upload it.
      - name: Stop only this fixture cluster
        if: always()
        run: |
          if test -n "${SETUP_FIXTURE_DIR:-}" && test -f "$SETUP_FIXTURE_DIR/data/postmaster.pid"; then
            /usr/lib/postgresql/16/bin/pg_ctl -D "$SETUP_FIXTURE_DIR/data" -m fast -w stop
          fi
